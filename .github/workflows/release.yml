name: Release

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@eb4312a66bdd55f6b96adb74865e1dccf1c268da
    with:
      repository-name: musicbrainz-ingestion
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: dist/musicbrainz-ingestion.tar.gz
      checksums-path: dist/SHA256SUMS
      notices-path: dist/THIRD_PARTY_NOTICES.json
      sbom-path: dist/musicbrainz-ingestion.cdx.json
      buildkit-cache-mounts: '{"sccache-musicbrainz-ingestion": "/root/.cache/sccache"}'
      publish-image: true
