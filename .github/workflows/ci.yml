name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    uses: groovemap-music/automation/.github/workflows/reusable-ci.yml@eb4312a66bdd55f6b96adb74865e1dccf1c268da
    with:
      runner: ubuntu-24.04
      language: rust
      setup-command: just setup
      check-command: just check
      coverage-command: just coverage
      audit-command: just audit
      license-command: just license-check
      secret-scan-command: just secret-scan
      package-command: just build
      install-command: just install-check
      image-command: just image
      coverage-files: lcov.info
      coverage-flags: rust
      upload-codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
